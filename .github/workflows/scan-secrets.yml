name: scan-secrets
on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.18.4"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
